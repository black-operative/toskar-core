services:
  node-a:
    build: .
    hostname: node-a
    environment:
      TOSKAR_NODE_ID: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
      TOSKAR_NODE_NAME: Node-A
      TOSKAR_ADVERTISE_HOST: node-a
      TOSKAR_STATIC_PEERS: node-b:7332,node-c:7332
      TOSKAR_API_HOST: "0.0.0.0"
      TOSKAR_INTERNAL_HOST: "0.0.0.0"
      TOSKAR_DISCOVERY_ENABLED: "true"
      TOSKAR_STUB_INFERENCE: "true"
      TOSKAR_API_KEY: "ygg_cluster_local_test_key"
    volumes:
      - a-data:/data
    networks: [cluster]

  node-b:
    build: .
    hostname: node-b
    environment:
      TOSKAR_NODE_ID: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
      TOSKAR_NODE_NAME: Node-B
      TOSKAR_ADVERTISE_HOST: node-b
      TOSKAR_STATIC_PEERS: node-a:7332,node-c:7332
      TOSKAR_API_HOST: "0.0.0.0"
      TOSKAR_INTERNAL_HOST: "0.0.0.0"
      TOSKAR_DISCOVERY_ENABLED: "true"
      TOSKAR_STUB_INFERENCE: "true"
      TOSKAR_API_KEY: "ygg_cluster_local_test_key"
    volumes:
      - b-data:/data
    networks: [cluster]

  node-c:
    build: .
    hostname: node-c
    environment:
      TOSKAR_NODE_ID: cccccccc-cccc-4ccc-8ccc-cccccccccccc
      TOSKAR_NODE_NAME: Node-C
      TOSKAR_ADVERTISE_HOST: node-c
      TOSKAR_STATIC_PEERS: node-a:7332,node-b:7332
      TOSKAR_API_HOST: "0.0.0.0"
      TOSKAR_INTERNAL_HOST: "0.0.0.0"
      TOSKAR_DISCOVERY_ENABLED: "true"
      TOSKAR_STUB_INFERENCE: "true"
      TOSKAR_API_KEY: "ygg_cluster_local_test_key"
    volumes:
      - c-data:/data
    networks: [cluster]

  driver:
    build: .
    entrypoint: ["/usr/local/bin/clustercheck"]
    environment:
      NODE_A_URL: http://node-a:7331
      NODE_B_URL: http://node-b:7331
      NODE_C_URL: http://node-c:7331
      NODE_B_INTERNAL: http://node-b:7332
      TOSKAR_API_KEY: "ygg_cluster_local_test_key"
    depends_on:
      - node-a
      - node-b
      - node-c
    networks: [cluster]

networks:
  cluster:

volumes:
  a-data:
  b-data:
  c-data:
