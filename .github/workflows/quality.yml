name: Quality

# The quality test set against real models (spec §64). The same cases run
# against the stub model in CI on every change; this runs them against a
# daemon with real models installed, on a self-hosted runner, so defaults
# are changed with evidence. It runs only when the repository variable
# QUALITY_DAEMON_URL names that daemon.

on:
  schedule:
    - cron: "17 6 * * 1"
  # The real model takes about fifteen minutes, so it is not run on pull
  # requests: they get the stub run in CI, and a release is held to the
  # real model by the Release workflow. Start this by hand to check a
  # change to chat before it merges.
  workflow_dispatch:

jobs:
  # The quality set with a real model on CPU (Llama 3.2 1B through
  # llama-server), the web answered from tests/quality/web.json. It fails
  # when fewer than 90% of cases pass; the report lists every answer.
  served-model:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: actions/cache@v4
        with:
          path: .quality-cache
          key: quality-model-b11174-llama-3.2-1b-q4km
      - name: Quality set with a real model
        env:
          GH_TOKEN: ${{ github.token }}
          TOSKAR_QUALITY_REPORT: ${{ runner.temp }}/quality-report.md
        run: scripts/quality-model.sh run
      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/quality-report.md" ]; then
            head -c 60000 "$RUNNER_TEMP/quality-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report-core
          path: ${{ runner.temp }}/quality-report.md
          if-no-files-found: ignore

  real-models:
    if: vars.QUALITY_DAEMON_URL != ''
    # A self-hosted runner with real models installed, labeled
    # toskar-models; none is set up yet (#296), so the job
    # is skipped until QUALITY_DAEMON_URL is set.
    runs-on: [self-hosted, toskar-models]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Quality set
        env:
          TOSKAR_QUALITY_URL: ${{ vars.QUALITY_DAEMON_URL }}
          TOSKAR_QUALITY_KEY: ${{ secrets.QUALITY_API_KEY }}
        run: go test ./tests/quality -count=1 -v -timeout 60m
