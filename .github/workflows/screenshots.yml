name: Screenshots

# Captures the README screenshots, the walkthrough, and the App Store images
# from demo data. Run by the Release workflow after a release is published,
# which attaches the README screenshots and the walkthrough to the release so
# toskar.ai shows the ones that match it. Run it by hand with a tag
# to attach them to an existing release, or without one to only capture.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the screenshots to, such as v1.4.0. Leave blank to only capture."
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to capture and attach the screenshots to."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: screenshots-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ${{ fromJSON(vars.TRUSTED_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Capture the release's own interface, not whatever main has now.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            scripts/screenshots/pnpm-lock.yaml
      - name: Install ImageMagick and ffmpeg
        # A self-hosted runner has them installed already.
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
      - name: Capture and validate
        run: |
          chmod +x scripts/capture-screenshots.sh
          ./scripts/capture-screenshots.sh
      - name: Keep what the page showed when a screen timed out
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-failures
          path: screenshot-failed-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            docs/screenshots
            screenshots/appstore
          if-no-files-found: error
      # Release assets are one flat list, so each file gets a screenshot-
      # prefix; the site looks for screenshot-<name>. --clobber replaces the
      # files when the workflow is run again for the same release.
      - name: Attach to the release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-screenshots
          for f in docs/screenshots/*.png docs/screenshots/demo.mp4; do
            cp "$f" "/tmp/release-screenshots/screenshot-$(basename "$f")"
          done
          gh release upload "$TAG" /tmp/release-screenshots/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached $(ls /tmp/release-screenshots | wc -l) screenshots to ${TAG}."
