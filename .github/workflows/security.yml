name: Security

# The weekly run catches advisories published against dependencies that
# have not changed. Pushes and pull requests scan only when a dependency
# changes.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - ".github/workflows/security.yml"

concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        run: govulncheck ./...

  pnpm-audit:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # Each job gets its own pnpm: self-hosted runners share a home folder,
      # and two jobs installing into ~/setup-pnpm at once break each other.
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm audit --prod || true
