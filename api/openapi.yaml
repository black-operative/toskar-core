  /api/v1/chat:
    post:
      summary: Send a chat message
      description: "Without stream, returns {content, metrics}. With stream, a server-sent event stream of token events, then done; an error event ends it early."
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                message:
                  type: string
                profile_id:
                  type: string
                model_id:
                  type: string
                  description: "A model id, auto, or sai:<slug>"
                effort:
                  type: string
                  enum: [auto, fast, balanced, thorough]
                time_zone:
                  type: string
                  description: "The person's IANA time zone, such as America/Juneau, for the date and time the answer uses; this computer's when empty or unknown"
                attachments:
                  type: array
                  items:
                    type: string
                  description: Artifact ids from POST /api/v1/artifacts
                execution:
                  type: string
                  description: Where the turn runs, such as local
                stream:
                  type: boolean
              required: [message]
      responses:
        "200":
          description: The answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                  metrics:
                    type: object
                    additionalProperties: true
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/chat/stop:
    post:
      summary: Stop a conversation's running turn
      operationId: stopChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
              required: [conversation_id]
      responses:
        "200":
          description: Whether a turn was stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped:
                    type: boolean
