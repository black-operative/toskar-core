                type: object
                additionalProperties: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/nodes/{id}/revoke:
    post:
      summary: Stop trusting a paired computer
      operationId: revokeNode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/api-keys:
    get:
      summary: API keys, without their secrets
      operationId: listAPIKeys
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
    post:
      summary: "Create an API key; the secret is shown only in this response"
      operationId: createAPIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: "#/components/schemas/APIKey"
                  secret:
                    type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/api-keys/{id}:
    delete:
      summary: Delete an API key
      operationId: deleteAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/api-keys/{id}/rotate:
    post:
      summary: "Replace a key's secret; the old one stops working"
      operationId: rotateAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: "#/components/schemas/APIKey"
                  secret:
                    type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/notifications/{id}:
    get:
      summary: One notification with each channel's delivery
      operationId: getNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: No such notification
  /api/v1/notifications/destinations:
    get:
      summary: Email and webhook destinations. Passwords and signing secrets are never returned.
      operationId: listNotificationDestinations
      responses:
        "200":
          description: Destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationDestination"
    post:
      summary: Add an email or webhook destination; a webhook's signing secret is returned this once
      operationId: createNotificationDestination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDestinationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  destination:
                    $ref: "#/components/schemas/NotificationDestination"
                  secret:
                    type: string
                    description: The webhook signing secret, shown only now
        "400":
          description: Invalid destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/notifications/destinations/{id}:
    get:
      summary: One destination
      operationId: getNotificationDestination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDestination"
        "404":
          description: No such destination
    patch:
      summary: Change a destination; an empty password keeps the stored one
      operationId: updateNotificationDestination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDestinationInput"
      responses:
        "200":
          description: Destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDestination"
        "400":
          description: Invalid destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such destination
    delete:
      summary: Remove a destination, its stored secret, and its waiting deliveries
      operationId: deleteNotificationDestination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          description: No such destination
  /api/v1/notifications/destinations/{id}/test:
    post:
      summary: Send a test notification now
      operationId: testNotificationDestination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Whether it was delivered, and why not
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  permanent:
                    type: boolean
                    description: Retrying will not help until the destination is changed
        "404":
          description: No such destination
  /api/v1/notifications/destinations/{id}/rotate-secret:
    post:
      summary: Replace a webhook's signing secret; the old one stops working
      operationId: rotateNotificationSecret
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The new secret, shown only now
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
        "400":
          description: Not a webhook
  /api/v1/notifications/quiet-hours:
    get:
      summary: Quiet hours
      operationId: getQuietHours
      responses:
        "200":
          description: Quiet hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuietHours"
    put:
      summary: Set quiet hours
      operationId: setQuietHours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuietHours"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuietHours"
        "400":
          description: Invalid quiet hours
  /api/v1/tools/runs:
    get:
      summary: Audited tool calls, newest first; records expire with run records
      operationId: listToolRuns
      parameters:
        - name: tool_id
          in: query
          schema:
            type: string
        - name: conversation_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolRun"
  /api/v1/tools/{id}:
    get:
      summary: One tool's descriptor
      operationId: describeTool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDescriptor"
        "404":
          description: No such tool
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key from the API Access page, or TOSKAR_API_KEY
  schemas:
    AssistantOptions:
      type: object
      description: The assistant's own controls for an OpenAI-compatible request, sent as toskar (or yggdrasil, its name from before the rename)
      properties:
        memory:
          type: boolean
        knowledge:
          type: boolean
        knowledge_sources:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: string
        effort:
          type: string
          enum: [auto, fast, balanced, thorough]
        placement:
          type: string
          enum: [local, automatic]
        progress:
          type: boolean
          description: Stream progress and tool activity as chunks with an empty delta and the toskar and yggdrasil fields
    RuntimeSample:
      type: object
      properties:
        at:
          type: string
          format: date-time
        goroutines:
          type: integer
          description: The daemon's background tasks
        heap_bytes:
          type: integer
          description: Memory in use by Go objects
        sys_bytes:
          type: integer
          description: All memory the Go runtime holds from the system
    PersonalStyle:
      type: object
      properties:
        length:
          type: string
          enum: [brief, balanced, detailed]
        tone:
          type: string
          enum: [friendly, neutral, direct]
        format:
          type: string
          enum: [prose, lists]
        units:
          type: string
          enum: [metric, imperial]
        about_me:
          type: string
          maxLength: 1500
        instructions:
          type: string
          maxLength: 1500
    ExternalServer:
      type: object
      properties:
        base_url: {type: string}
        has_key: {type: boolean}
        models: {type: array, items: {type: string}}
        error: {type: string, description: Why the model list couldn't be read}
    JoinToken:
      type: object
      properties:
        id: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        used_at: {type: string, format: date-time}
        used_by: {type: string}
        revoked_at: {type: string, format: date-time}
        status: {type: string, enum: [active, used, revoked, expired]}
    NetworkNode:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        address: {type: string}
        status: {type: string}
        fingerprint: {type: string}
    RatingTag:
      type: string
      enum: [great_responses, fast, slow, stable, crashed, too_much_memory, great_for_coding, great_for_chat, good_tool_use, poor_tool_use]
    ModelRating:
      type: object
      properties:
        model_id: {type: string}
        rateable:
          type: boolean
          description: False when the model cannot be compared with others' ratings (reason says why); it can still be rated on this computer.
        reason: {type: string}
        stars: {type: integer, minimum: 1, maximum: 5, description: Absent when not rated}
        tags:
          type: array
          items: {$ref: "#/components/schemas/RatingTag"}
        shared: {type: boolean}
        shared_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        share_observations: {type: boolean, description: The shared rating includes how the model runs here}
        observations:
          $ref: "#/components/schemas/RatingObservations"
        ask: {type: boolean, description: A good time to ask for a rating}
        shares:
          type: object
          description: What sharing sends besides the stars, tags, a random rating ID, and the app version
          properties:
            destination: {type: string}
            model:
              type: object
              properties:
                id: {type: string}
                format: {type: string}
                quantization: {type: string}
                runtime: {type: string}
                backend: {type: string}
            hardware:
              type: object
              properties:
                platform: {type: string}
                architecture: {type: string}
                vendor: {type: string}
                family: {type: string}
                memory_type: {type: string}
                memory_bucket_gb: {type: string}
    RatingStats:
      type: object
      properties:
        tier: {type: string, enum: [family, class, backend, global]}
        cohort: {type: string}
        ratings: {type: integer}
        average: {type: number}
        weighted_score: {type: number}
        confidence: {type: string, enum: [limited, early, community]}
        tags:
          type: object
          additionalProperties: {type: integer}
        observed: {type: integer, description: Ratings that shared how the model runs}
        median_tokens_per_second: {type: number}
        median_ttft_ms: {type: number}
        successful_start_rate: {type: number}
        crash_rate: {type: number}
        out_of_memory_rate: {type: number}
    RatingObservations:
      type: object
      description: How a model ran on this computer in the last 30 days, leaving out replies on paired computers; absent when nothing was measured
      properties:
        tokens_per_second: {type: number, description: Median, from 3 or more replies}
        ttft_ms: {type: integer, description: Median time to first token, from 3 or more replies}
        starts: {type: integer}
        start_failures: {type: integer}
        crashed: {type: boolean}
        out_of_memory: {type: boolean}
        context_band: {type: string, enum: [0-8k, 8-32k, 32-128k, 128k+]}
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        product:
          type: string
        version:
          type: string
    VersionResponse:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
        product:
          type: string
        license:
          type: string
        source:
          type: string
          description: URL of the corresponding source for this build.
        contract:
          type: object
          description: The client contract this build speaks (major.minor). Also in the Toskar-Contract and Yggdrasil-Contract headers on every response.
          properties:
            version:
              type: string
            major:
              type: integer
    SourceOffer:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        commit:
          type: string
        license:
          type: string
        source:
          type: string
    HardwareInventory:
      type: object
      additionalProperties: true
    Model:
      type: object
      additionalProperties: true
    AIProfile:
      type: object
      additionalProperties: true
    Node:
      type: object
      additionalProperties: true
    SettingsView:
      type: object
      additionalProperties: true
    GenerationRun:
      type: object
      additionalProperties: true
    BenchmarkWorkload:
      type: object
      additionalProperties: true
    BenchmarkRequest:
      type: object
      additionalProperties: true
    BenchmarkJob:
      type: object
      additionalProperties: true
    Conversation:
      type: object
      additionalProperties: true
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    InstallFromURLRequest:
      type: object
      properties:
        source_url:
          type: string
        display_name:
          type: string
        id:
          type: string
        filename:
          type: string
        size_bytes:
          type: integer
        parameters:
          type: string
        variant:
          type: string
        tags:
          type: array
          items:
            type: string
        node_id:
          type: string
      required: [source_url]
    Message:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        role:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        meta:
          type: object
          description: Sources, steps, and files of an answer
          additionalProperties: true
      additionalProperties: true
    ImageSetup:
      type: object
      properties:
        supported: {type: boolean, description: "False where stable-diffusion.cpp has no build or cannot run"}
        unsupported: {type: string}
        ready: {type: boolean, description: "Images can be made now"}
        program: {type: boolean, description: "stable-diffusion.cpp is installed"}
        release: {type: string}
        active: {type: string, description: "The model images are made with"}
        models:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              description: {type: string}
              license: {type: string}
              memory_bytes: {type: integer, format: int64}
              size_bytes: {type: integer, format: int64}
              edits: {type: boolean, description: "Edits images, or for a video model, animates them"}
              kind: {type: string, enum: [image, video]}
              installed: {type: boolean}
              recommended: {type: boolean}
              files:
                type: array
                items:
                  type: object
                  properties:
                    role: {type: string, enum: [diffusion, vae, llm, t5xxl]}
                    repo: {type: string}
                    path: {type: string}
                    size_bytes: {type: integer, format: int64}
                    sha256: {type: string}
        job:
          type: object
          properties:
            model_id: {type: string}
            stage: {type: string, enum: [program, model]}
            done_bytes: {type: integer, format: int64}
            total_bytes: {type: integer, format: int64}
            running: {type: boolean}
            error: {type: string}
    Artifact:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        name:
          type: string
        mime_type:
          type: string
        kind:
          type: string
        size_bytes:
          type: integer
        producer:
          type: string
        source_task:
          type: string
      additionalProperties: true
    Memory:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        category:
          type: string
        enabled:
          type: boolean
        local_only:
          type: boolean
      additionalProperties: true
    KnowledgeSource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [path, text, database, api]
        path:
          type: string
        filename:
          type: string
        status:
          type: string
        error:
          type: string
        chunk_count:
          type: integer
        embedded_count:
          type: integer
        embedding_model:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        refreshed_at:
          type: string
          format: date-time
        local_only:
          type: boolean
        remote:
          type: object
          description: How a database or API source is reached, without its credentials
          additionalProperties: true
    SpecializedAI:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        goal:
          type: string
        instructions:
          type: string
        base_model_id:
          type: string
        preset:
          type: string
          enum: [quick, balanced, quality]
        knowledge_sources:
          type: array
          items:
            type: string
        deployed_revision:
          type: integer
      additionalProperties: true
    TrainingJob:
      type: object
      properties:
        id:
          type: string
        ai_id:
          type: string
        revision:
          type: integer
        node_id:
          type: string
        node_name:
          type: string
        backend:
          type: string
        state:
          type: string
          enum: [queued, preparing_dataset, loading_model, training, evaluating, exporting, complete, failed, cancelled]
        progress:
          type: object
          additionalProperties: true
        error:
          type: string
      additionalProperties: true
    ExportStatus:
      type: object
      properties:
        ai_id:
          type: string
        revision:
          type: integer
        state:
          type: string
          enum: [none, exporting, ready, failed]
        filename:
          type: string
        size_bytes:
          type: integer
        error:
          type: string
        created_at:
          type: string
          format: date-time
        instructions:
          type: string
          description: The system prompt to use with the file
      additionalProperties: true
    Schedule:
      type: object
      properties:
        kind:
          type: string
          enum: [once, daily, weekly, interval]
        time_zone:
          type: string
          description: IANA time zone
        at:
          type: string
          format: date-time
          description: For once
        hour:
          type: integer
        minute:
          type: integer
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Sunday is 0
        every_seconds:
          type: integer
          description: For interval
        anchor:
          type: string
          format: date-time
      required: [kind, time_zone]
    AutomationNotification:
      type: object
      properties:
        mode:
          type: string
          enum: [always, condition, change, failure, none]
        condition:
          type: object
          properties:
            kind:
              type: string
              enum: [threshold, available, significant]
            op:
              type: string
              enum: [below, above]
            value:
              type: number
            currency:
              type: string
              pattern: "^[A-Z]{3}$"
              description: ISO 4217 code of a threshold's value, such as EUR. The run reports the price in this currency. Omitted means USD.
    AutomationInput:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        schedule:
          $ref: "#/components/schemas/Schedule"
        prompt:
          type: string
        profile_id:
          type: string
        model_id:
          type: string
          description: An installed model, or auto
        tools:
          type: array
          items:
            type: string
          description: Tools approved to run unattended
        notification:
          $ref: "#/components/schemas/AutomationNotification"
        response_language:
          type: string
          description: The language results are written in. account (or omitted) follows the assistant language setting, app the App language, auto the language of the request, or a BCP 47 tag such as de. A language the request asks for always wins.
    Automation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        schedule:
          $ref: "#/components/schemas/Schedule"
        prompt:
          type: string
        profile_id:
          type: string
        model_id:
          type: string
        tools:
          type: array
          items:
            type: string
        notification:
          $ref: "#/components/schemas/AutomationNotification"
        response_language:
          type: string
          description: The language results are written in. account (or omitted) follows the assistant language setting, app the App language, auto the language of the request, or a BCP 47 tag such as de. A language the request asks for always wins.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        next_run_at:
          type: string
          format: date-time
        last_run_at:
          type: string
          format: date-time
        consecutive_failures:
          type: integer
        last_error:
          type: string
        last_status:
          type: string
        last_result:
          type: string
    PairingOffer:
      type: object
      properties:
        session_id:
          type: string
        from_node_id:
          type: string
        to_node_id:
          type: string
          description: The computer the offer is for; others refuse it.
        from_name:
          type: string
        from_cert_pem:
          type: string
        from_address:
          type: string
        code:
          type: string
        expires_at:
          type: string
        signature:
          type: string
          description: Base64 ed25519 signature by the key in from_cert_pem over the session, both node IDs, the code, the expiry, and the key's fingerprint. Unsigned offers are refused.
    APIKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        permissions:
          type: object
          properties:
            memory:
              type: string
              enum: [never, on_request, always]
            knowledge:
              type: string
              enum: [never, on_request, always]
            tools:
              type: string
              enum: [profile, read_only, none]
            placement:
              type: boolean
      additionalProperties: true
    Notification:
      type: object
      properties:
        id: {type: string}
        created_at: {type: string, format: date-time}
        source_type: {type: string}
        source_id: {type: string}
        category: {type: string, enum: [automation, approval, model, training, health, system]}
        severity: {type: string, enum: [info, success, warning, error]}
        title: {type: string}
        body: {type: string}
        link: {type: string}
        read_at: {type: string, format: date-time}
        repeat_count: {type: integer}
        deliveries:
          type: array
          items:
            type: object
            properties:
              channel: {type: string, description: "desktop, or email:<id> or webhook:<id>"}
              destination_id: {type: string}
              status: {type: string, enum: [delivered, failed, suppressed, pending, held, cancelled]}
              attempts: {type: integer}
              delivered_at: {type: string, format: date-time}
              next_attempt_at: {type: string, format: date-time}
              error: {type: string}
    NotificationDestinationInput:
      type: object
      properties:
        kind: {type: string, enum: [email, webhook, ntfy], description: Required when creating}
        name: {type: string}
        enabled: {type: boolean}
        email:
          type: object
          properties:
            host: {type: string}
            port: {type: integer, description: Default 587, or 465 with tls}
            username: {type: string}
            from: {type: string}
            to: {type: array, items: {type: string}, maxItems: 20}
            tls: {type: string, enum: [starttls, tls, none], description: none only for a server on this computer}
        webhook:
          type: object
          properties:
            url: {type: string, description: "https, or http on this computer or the local network"}
        ntfy:
          type: object
          properties:
            server: {type: string, description: "Default https://ntfy.sh"}
            topic: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
            content: {type: string, enum: [full, private], description: "private sends only a generic notice; the default on ntfy.sh"}
            open_url: {type: string, description: This Toskar's address; tapping a notification opens it there}
        categories: {type: array, items: {type: string}, description: Empty receives every category}
        min_severity: {type: string, enum: [info, success, warning, error]}
        digest:
          $ref: "#/components/schemas/NotificationDigest"
        password: {type: string, description: The SMTP password or ntfy access token; stored as a secret and never returned}
    NotificationDestination:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [email, webhook, ntfy]}
        name: {type: string}
        enabled: {type: boolean}
        email: {type: object, additionalProperties: true}
        webhook: {type: object, additionalProperties: true}
        ntfy: {type: object, additionalProperties: true}
        categories: {type: array, items: {type: string}}
        min_severity: {type: string}
        digest:
          $ref: "#/components/schemas/NotificationDigest"
        has_secret: {type: boolean}
    NotificationDigest:
      type: object
      description: A daily digest instead of each notice; errors still go out at once. On a change, an empty at turns it off.
      properties:
        at: {type: string, description: "HH:MM"}
        time_zone: {type: string, description: "IANA time zone; UTC when left out"}
    QuietHours:
      type: object
      properties:
        enabled: {type: boolean}
        start: {type: string, example: "22:00"}
        end: {type: string, example: "07:00"}
        time_zone: {type: string, example: Europe/Berlin}
        allow: {type: string, enum: [errors, nothing], description: errors lets errors through; nothing holds everything}
    ToolDescriptor:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        capability: {type: string}
        source: {type: string}
        risk: {type: string, enum: [read, create, write]}
        default_policy: {type: string}
        version: {type: integer}
        input_schema: {type: object, additionalProperties: true, description: JSON Schema of the arguments}
        outputs: {type: array, items: {type: string, enum: [text, file, image, audio, video]}}
        level: {type: integer, minimum: 1, maximum: 4, description: "1 low risk on this computer, 2 reads outside data, 3 changes things, 4 runs commands or code"}
        level_name: {type: string}
        execution: {type: string, enum: [local, remote, either]}
        requirements:
          type: object
          properties:
            network: {type: boolean}
            filesystem: {type: boolean}
            credentials: {type: boolean}
            runtime: {type: string}
            gpu: {type: boolean}
        supports:
          type: object
          properties:
            progress: {type: boolean}
            cancel: {type: boolean}
        timeout_seconds: {type: integer}
        provider: {type: string, description: "builtin, connector:<service>, or mcp:<source>"}
        enabled: {type: boolean}
        health: {type: string, enum: [ok, off, unavailable]}
        profiles: {type: array, items: {type: string}}
    ToolRun:
      type: object
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        tool_id: {type: string}
        status: {type: string, enum: [completed, cached, failed, denied, refused, disabled]}
        approval: {type: string, enum: [profile, you, session]}
        duration_ms: {type: integer}
        summary: {type: string, description: "What the call was about: a query, an address, a path; never a file's contents"}
        error: {type: string}
        source: {type: string}
        conversation_id: {type: string}
        task_id: {type: string}
