      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artifact"
  /api/v1/speech:
    post:
      summary: Read text aloud on this computer; the audio is kept as a file in the chat
      operationId: readAloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, maxLength: 5000}
                voice: {type: string, description: "A Piper voice, such as en_US-lessac-medium (default)"}
                conversation_id: {type: string}
      responses:
        "200":
          description: The audio file and its length in seconds
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact:
                    $ref: "#/components/schemas/Artifact"
                  seconds: {type: number}
        "400":
          description: Invalid text or voice, or reading failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Speech cannot run on this computer
  /api/v1/images/setup:
    get:
      summary: What image generation has installed, the models on offer, and any setup in progress
      operationId: getImageSetup
      responses:
        "200":
          description: Image generation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSetup"
    post:
      summary: Install stable-diffusion.cpp and an image model in the background
      operationId: startImageSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id]
              properties:
                model_id: {type: string, description: "A model from the status's models, such as flux2-klein-4b"}
      responses:
        "202":
          description: Setup started; poll the status for its progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSetup"
        "409":
          description: Setup is already running, there is too little space, or this computer cannot run it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Stop the setup in progress; what was downloaded is kept and resumed next time
      operationId: cancelImageSetup
      responses:
        "200":
          description: Image generation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSetup"
  /api/v1/images/models/{id}:
    delete:
      summary: Delete an installed image model to free its space
      operationId: removeImageModel
      parameters:
        - name: id
